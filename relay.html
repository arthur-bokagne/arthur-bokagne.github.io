<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<script>
(async()=>{
  const ok=['https://www.linkedin.com','https://fr.indeed.com','https://profile.indeed.com','https://www.hellowork.com'];
  const f=new URLSearchParams(location.search).get('f')||'';
  if(!/^[A-Za-z0-9_.-]+\.(pdf|docx)$/.test(f)) return; const tgt=window.opener||(window.parent!==window?window.parent:null); if(!tgt) return;
  const buf=await (await fetch('cv/'+f,{cache:'no-store'})).arrayBuffer();
  for(const o of ok){ try{ tgt.postMessage({cvRelay:f,buf},o); }catch(e){} }
  setTimeout(()=>window.close(),1500);
})();
</script>
